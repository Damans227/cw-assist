<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Support assist</title>
<style>
  :root{
    --ink:#0e1620; --body:#232e3a; --mute:#4c5866; --faint:#69737f;
    --line:#dbe1ea; --hair:#eef2f6; --page:#fbfcfd;
    --field:#c1cbd8;                 /* input borders — darker than --line */
    /* ConnectWise's palette as the baseline: navy + mid blue */
    --accent:#0f6cbd; --accent-dark:#0a3560; --accent-bg:#e6f1fb;
    --bad:#b3261e; --ok:#1f7a44; --warn:#a4610f;
  }
  *{ box-sizing:border-box; }
  /* .board-toolbar sets display:flex, which beats the UA stylesheet's [hidden] rule */
  [hidden]{ display:none !important; }
  html,body{ height:100%; }
  body{
    margin:0; display:flex; flex-direction:column; background:var(--page); color:var(--ink);
    font:15.5px/1.7 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  header{
    display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
    padding:12px 14px 11px; border-bottom:1px solid var(--line); background:#fff;
  }
  .hleft{ min-width:0; }
  .tk{ display:flex; align-items:baseline; gap:9px; }
  .tk b{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:20px; font-weight:700; }
  .tk span{ font-size:15px; font-weight:600; color:var(--accent-dark); }
  .sum{ margin:4px 0 0; font-size:14.5px; color:var(--mute);
        overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

  .board-toolbar{ display:flex; align-items:center; padding:10px 14px 0;
                  background:#fff; border-bottom:1px solid var(--line); }
  .tabs{ display:flex; gap:20px; align-self:stretch; }
  .tabs .tab{ font:inherit; font-size:14.5px; font-weight:500; padding:9px 1px 8px;
              border:none; border-bottom:2px solid transparent;
              background:transparent; color:var(--mute); cursor:pointer; }
  .tabs .tab:hover:not(.on){ color:var(--accent-dark); }
  .tabs .tab.on{ color:var(--accent-dark); font-weight:700; border-bottom-color:var(--accent); }
  .run{ flex:none; font:inherit; font-size:14.5px; font-weight:600;
        padding:6px 14px; white-space:nowrap; border:1px solid var(--accent);
        border-radius:7px; background:var(--accent); color:#fff; cursor:pointer; }
  .run:hover:not(:disabled){ background:var(--accent-dark); border-color:var(--accent-dark); }
  .run:disabled{ opacity:.4; cursor:default; }
  .openChatWrap{ display:flex; flex-direction:column; align-items:flex-end; gap:5px; }
  .attach-toggle{ display:flex; align-items:center; gap:5px; font-size:12px;
                  color:var(--mute); cursor:pointer; user-select:none; white-space:nowrap; }
  .attach-toggle input{ margin:0; }
  .ghost{ margin-left:auto; flex:none; font:inherit; font-size:14.5px; padding:6px 14px;
          white-space:nowrap; border:1px solid var(--line); border-radius:7px;
          background:#fff; color:var(--ink); cursor:pointer; }
  .ghost:hover:not(:disabled){ border-color:var(--accent); color:var(--accent); }
  .ghost:disabled{ opacity:.4; cursor:default; }

  .hist{ display:flex; flex-direction:column; gap:6px; }
  .hist-row{ border:1px solid var(--line); border-radius:7px; overflow:hidden; }
  .hist-head{ display:flex; align-items:center; gap:9px; padding:10px 12px; cursor:pointer;
              background:#fff; font-size:14.5px; }
  .hist-head:hover{ background:var(--hair); }
  .hist-caret{ display:inline-block; color:var(--faint); transition:transform .12s; }
  .hist-row.open .hist-caret{ transform:rotate(90deg); }
  .hist-when{ font-weight:700; color:var(--accent-dark); font-size:15.5px; white-space:nowrap; }
  /* flex:1 rather than margin-left:auto on the button after it — a ticket
     history row has no CSV button, so whichever trailing button exists
     still needs pushing to the right edge */
  .hist-count{ flex:1; color:var(--mute); white-space:nowrap; }
  .hist-csv,.hist-del{ font:inherit; font-size:13px; padding:4px 9px; line-height:1.4;
        border:1px solid var(--line); border-radius:5px; background:#fff; color:var(--mute); cursor:pointer; }
  .hist-del{ color:var(--bad); }
  .hist-csv:hover{ border-color:var(--accent); color:var(--accent); }
  .hist-del:hover{ border-color:var(--bad); color:var(--bad); }
  .hist-body{ padding:10px 12px 2px; border-top:1px solid var(--hair); background:var(--page); }

  /* table-layout:auto leaves the last column short of the panel's edge —
     fixed + explicit widths on the narrow columns hands the rest to it */
  main table{ border-collapse:collapse; table-layout:fixed; width:100%; font-size:14.5px; margin:0 0 10px; }
  main th:first-child, main td:first-child{ width:62px; }
  main th:nth-child(2), main td:nth-child(2){ width:150px; }
  main th{ text-align:left; font-weight:700; color:var(--accent-dark); padding:7px 9px;
           border-bottom:1px solid var(--line); white-space:nowrap; }
  main td{ padding:10px 10px; border-bottom:1px solid var(--hair);
           vertical-align:top; color:var(--body); overflow-wrap:break-word; }
  main td .lbl{ display:inline-block; margin-top:5px; font-weight:600; color:var(--ink); }
  main td:first-child{ font-family:ui-monospace,"SF Mono",Menlo,monospace;
                       font-weight:700; color:var(--accent-dark); white-space:nowrap; }
  main td code{ white-space:normal; word-break:break-word; }
  main tr:last-child td{ border-bottom:0; }

  main{ flex:1; overflow:auto; padding:14px; }
  main p{ margin:0 0 9px; color:var(--body); }
  main h4{ margin:16px 0 7px; font-size:16px; font-weight:700; color:var(--accent-dark); }
  main h4:first-child{ margin-top:0; }
  main ul{ margin:0 0 9px; padding-left:19px; }
  main li{ margin-bottom:5px; color:var(--body); }
  main strong{ font-weight:600; color:var(--ink); }
  main code{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:14px;
             background:var(--hair); padding:1px 5px; border-radius:4px; }
  main pre{ background:var(--hair); padding:10px 12px; border-radius:7px;
            overflow:auto; font-size:14px; margin:0 0 9px; }
  main pre code{ background:none; padding:0; }

  .idle,.wait,.err{ font-size:14.5px; }
  .idle{ color:var(--faint); }
  .wait{ color:var(--accent); font-weight:600; }
  .err{ color:var(--bad); }
  .ok{ color:var(--ok); font-weight:600; }
  .ok a{ color:var(--ok); }

  /* GitHub issue draft editor */
  .ghdraft{ display:flex; flex-direction:column; gap:5px; }
  .ghlabel{ font-size:13px; font-weight:700; color:var(--accent-dark); margin-top:8px; }
  .ghlabel:first-child{ margin-top:0; }
  .ghtitle,.ghbody{ font:inherit; width:100%; padding:8px 10px; border:1px solid var(--line);
                    border-radius:6px; background:#fff; color:var(--ink); }
  .ghtitle{ font-size:14.5px; }
  .ghbody{ font:13.5px/1.6 ui-monospace,"SF Mono",Menlo,monospace; resize:vertical; min-height:240px; }
  .ghtitle:focus,.ghbody:focus{ outline:none; border-color:var(--accent); }
  .ghactions{ display:flex; align-items:center; gap:9px; margin-top:12px; flex-wrap:wrap; }
  .ghmsg{ font-size:13.5px; }

  /* settings view */
  #settingsView{ flex:1; overflow:auto; padding:16px 15px 30px; background:#eef1f6; }
  .set-h{ font-size:13px; font-weight:800; text-transform:uppercase; letter-spacing:.04em;
          color:var(--accent-dark); margin:24px 0 12px; padding-bottom:6px;
          border-bottom:2px solid var(--accent); }
  .set-h:first-child{ margin-top:2px; }
  .set-row{ margin-bottom:15px; }
  .set-row > label{ display:block; font-size:14.5px; font-weight:700; color:var(--ink); margin-bottom:5px; }
  #settingsView .hint{ font-size:12.5px; color:var(--mute); line-height:1.5; }
  .set-row .hint{ margin-top:5px; }
  .set-row > label .hint{ font-weight:500; }
  #settingsView input, #settingsView textarea, #settingsView select{
    font:inherit; font-size:14.5px; width:100%; padding:9px 11px; border:1.5px solid var(--field);
    border-radius:7px; background:#fff; color:var(--ink); }
  #settingsView textarea{ font:13px/1.6 ui-monospace,"SF Mono",Menlo,monospace;
    resize:vertical; min-height:96px; white-space:pre-wrap; }
  #settingsView input::placeholder, #settingsView textarea::placeholder{ color:#98a2af; }
  #settingsView code{ font-family:ui-monospace,"SF Mono",Menlo,monospace; font-size:.88em;
    background:#dde7f2; color:var(--accent-dark); padding:1px 5px; border-radius:4px; word-break:break-word; }
  #settingsView input:focus, #settingsView textarea:focus, #settingsView select:focus{
    outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-bg); }
  .set-inline{ display:flex; gap:9px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  .set-inline .run, .set-inline .ghost, .set-inline .set-btn{ margin-left:0; }
  .set-btn{ font:inherit; font-size:13.5px; font-weight:600; padding:8px 14px;
            border:1.5px solid var(--accent); border-radius:7px; background:#fff;
            color:var(--accent); cursor:pointer; white-space:nowrap; }
  .set-btn:hover:not(:disabled){ background:var(--accent); color:#fff; }
  .set-btn:disabled{ opacity:.45; cursor:default; }
  .set-state{ font-size:13px; color:var(--mute); font-weight:500; }
  .set-state.ok{ color:var(--ok); font-weight:700; }
  .set-state.bad{ color:var(--bad); font-weight:700; }
  .set-state.warn{ color:var(--warn); font-weight:700; }
  .repo-row{ display:flex; gap:7px; margin-bottom:7px; }
  .repo-row .rn{ flex:0 0 38%; }
  .repo-row .ru{ flex:1; min-width:0; }
  .repo-row .rx{ flex:none; width:auto; padding:8px 13px; font-weight:700; font-size:15px;
    border:1.5px solid var(--field); border-radius:7px; background:#fff; color:var(--mute); cursor:pointer; }
  .repo-row .rx:hover{ border-color:var(--bad); color:var(--bad); }
  .set-adv{ margin-top:14px; border-top:1.5px solid var(--line); }
  .set-adv > summary{ cursor:pointer; font-size:13px; font-weight:800; text-transform:uppercase;
    letter-spacing:.04em; color:var(--accent-dark); margin:16px 0 12px; list-style:revert; }
  .tmpl-reset{ font:inherit; font-size:12.5px; font-weight:600; padding:5px 11px;
    border:1.5px solid var(--field); border-radius:6px; background:#fff; color:var(--mute);
    cursor:pointer; margin-top:7px; }
  .tmpl-reset:hover{ border-color:var(--accent); color:var(--accent); }

  footer{ padding:10px 15px; border-top:1px solid var(--line); background:#fff;
          font-size:13px; color:var(--mute); display:flex; gap:8px; align-items:center; }
  footer a{ color:var(--accent); font-size:14.5px; font-weight:700; text-decoration:underline;
            text-underline-offset:2px; }
  footer a:hover{ color:var(--accent-dark); }
  .foot-cfg{ display:flex; gap:14px; align-items:center; }
  .foot-links{ margin-left:auto; display:flex; gap:14px; align-items:center; }
  .foot-cfg #cfgExport, .foot-cfg #cfgImport{ font-size:13px; font-weight:600; color:var(--mute); }
  .foot-cfg #cfgExport:hover, .foot-cfg #cfgImport:hover{ color:var(--accent); }
</style>
</head>
<body>

<header>
  <div class="hleft">
    <div class="tk"><b id="num">—</b><span id="meta"></span></div>
    <p class="sum" id="sum"></p>
  </div>
  <button class="run" id="boardRun" hidden title="read every open ticket and ask the model again">Run summary</button>
  <div class="openChatWrap" id="openChatWrap" hidden>
    <label class="attach-toggle" title="save any attachments new since the last time this ticket was sent to your Downloads folder, named in the prompt">
      <input type="checkbox" id="attachToggle" checked> Save new files
    </label>
    <button class="run" id="openChat" title="open this ticket in Open WebUI and ask for next steps">Open in chat &rarr;</button>
  </div>
</header>

<div class="board-toolbar" id="ticketLaneBtns" hidden>
  <div class="tabs" id="ticketLaneTabs">
    <button class="tab on" data-lane="summary" title="what it is about, what was asked, what came back">Summary</button>
    <button class="tab" data-lane="standing" title="whose court, what we promised, what is unanswered">Outstanding</button>
    <button class="tab" data-lane="ghissue" title="draft a GitHub issue from this ticket, then create it">GitHub</button>
  </div>
  <button class="ghost" id="ticketRun" title="read the thread and ask the model again">Run summary</button>
</div>

<div class="board-toolbar" id="boardBtns" hidden>
  <div class="tabs" id="boardTabs">
    <button class="tab on" data-tab="latest" title="the most recent saved summary">Latest</button>
    <button class="tab" data-tab="history" title="every past run, saved on this machine">History</button>
  </div>
</div>



<main id="out"><span class="idle">Open a ticket in ConnectWise, then pick one.</span></main>
<section id="settingsView" hidden></section>

<footer>
  <span class="foot-cfg">
    <a href="#" id="cfgExport" hidden title="download all settings as a JSON file">Export</a>
    <a href="#" id="cfgImport" hidden title="load settings from a JSON file">Import</a>
  </span>
  <span id="foot"></span>
  <span class="foot-links"><a href="#" id="settings">Settings</a></span>
  <input type="file" id="cfgFile" accept="application/json,.json" hidden>
</footer>

<script src="cwlib.js"></script>
<script src="sidepanel.js"></script>
</body>
</html>
